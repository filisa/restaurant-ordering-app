<html>
	<head>
		<link rel="stylesheet" href="index.css" />
		<script src="index.js" type="module" defer></script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Smythe&display=swap"
			rel="stylesheet"
		/>
		<link rel="icon" type="image/x-icon" href="images/item-graphic.png" />
	</head>
	<body>
		<main>
			<img class="header" src="images/header.svg" />
			<div class="menu_items" id="menu_items"></div>
			<div class="your_order" id="your_order"></div>
			<div class="order-section" id="order-section">
				<h3>Your order</h3>
				<div class="my-order-list" id="my-order-list"></div>
				<hr />
				<div class="total-price" id="total-price">
					<p>Total price:</p>
					<p id="total_price"></p>
				</div>
				<button class="complete-order" id="complete-order">
					Complete order
				</button>
			</div>
			<div id="card-details-container" class="card-details-container">
				<h3>Enter card details</h3>
				<form>
					<input
						type="text"
						id="name"
						name="name"
						placeholder="Enter your name"
						required
						autofocus
					/><br />
					<input
						type="text"
						id="card-number"
						name="card-number"
						placeholder="Enter card number"
						required
					/>
					<input
						type="text"
						id="cvv"
						name="cvv"
						placeholder="CVV"
						maxlength="3"
						required
					/>
					<button class="complete-order" id="pay" type="submit">Pay</button>
				</form>
			</div>
		</main>
	</body>
</html>
